services:
  - type: web
    name: grokking-lab-audit
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install --index-url https://download.pytorch.org/whl/cpu torch && python -m pip install -e ".[web]"
    startCommand: grokking-lab serve --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
